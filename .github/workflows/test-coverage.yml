name: coverage

on: [push, pull_request]

permissions:
  contents: write

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test] genbadge[coverage]

      - name: Run tests with coverage
        run: |
          python -m pytest --cov --cov-report=term-missing --cov-report=xml tests/
          python -m coverage report --format=markdown >> $GITHUB_STEP_SUMMARY

      - name: Update coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p .github/badges
          genbadge coverage -i coverage.xml -o .github/badges/coverage.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges/coverage.svg
          git diff --cached --quiet || (git commit -m "chore: update coverage badge" && git push)